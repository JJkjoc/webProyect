<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo: menú interactivo</title>
</head>
<body style="margin:0;background:#070a12">
<!-- ===== INICIO DEL MÓDULO: MENÚ INTERACTIVO (copia desde aquí) ===== -->
<style>
#dm{--r:#d93a2b;--g:#f2c94c;background:#0f1422;color:#eef0f5;font-family:"Segoe UI",Roboto,Arial,sans-serif;border-radius:18px;padding:20px;max-width:960px;margin:20px auto;box-sizing:border-box}
#dm *{box-sizing:border-box}
#dm h2{font-family:Georgia,serif;text-align:center;margin:0 0 14px;font-size:1.6rem}
#dm .dm-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
#dm .dm-tab{flex:1;min-width:100px;background:#171d2e;border:1px solid #2c3550;color:#eef0f5;border-radius:12px;padding:10px;cursor:pointer;font-size:1rem}
#dm .dm-tab.on{background:linear-gradient(#e8452d,#c22b1b);border-color:#ff8a70}
#dm .dm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){#dm .dm-grid{grid-template-columns:1fr}}
#dm .dm-card{background:rgba(255,255,255,.05);border:1px solid #2c3550;border-radius:14px;padding:14px}
#dm .dm-book{background:#fff;color:#3a2530;text-align:center}
#dm .dm-book svg{width:100%;max-width:300px;display:block;margin:0 auto}
#dm #dm-cap{font-family:Georgia,serif;font-style:italic;border-top:1px solid #d9c9b5;padding-top:6px}
#dm #dm-ex{margin:0 0 10px;font-size:.9rem;opacity:.8}
#dm .dm-og{margin-bottom:12px}
#dm .dm-og b{display:block;color:var(--g);margin-bottom:6px;font-size:.9rem}
#dm .dm-opt{background:#2a3146;border:1px solid #475270;color:#eef0f5;border-radius:10px;padding:6px 12px;margin:0 6px 6px 0;cursor:pointer;font-size:.88rem}
#dm .dm-opt.on{background:#f2e24a;color:#2a2400;border-color:#f2e24a;font-weight:700}
#dm .dm-sug{font-size:.85rem;margin-bottom:12px}
#dm .dm-tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #3a4560;padding-top:10px}
#dm #dm-total{font-family:Georgia,serif;font-size:1.9rem;color:var(--g)}
#dm #dm-add{background:var(--g);border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
#dm #dm-cart{display:block;margin-top:6px;opacity:.7}
#dm .steam{opacity:0}
#dm .anim .ly{animation:dmDrop .7s cubic-bezier(.25,.9,.3,1.25) both;animation-delay:calc(var(--i)*.12s)}
#dm .anim .rise{animation:dmRise .9s ease both;transform-origin:150px 270px}
#dm .anim .steam{animation:dmSteam 3s ease-in infinite;animation-delay:var(--d)}
#dm .dm-book.flip{animation:dmFlip .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left center}
@keyframes dmDrop{from{transform:translateY(-140px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes dmRise{from{transform:translateY(60px) scale(.6);opacity:0}}
@keyframes dmSteam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.55}100%{opacity:0;transform:translateY(-26px)}}
@keyframes dmFlip{from{transform:perspective(1100px) rotateY(-70deg);opacity:.2}to{transform:none}}
@media (prefers-reduced-motion:reduce){#dm .anim *,#dm .flip{animation:none!important}}
</style>
<section id="dm">
 <h2>Arma tu pedido</h2>
 <div class="dm-tabs" id="dm-tabs"></div>
 <div class="dm-grid">
  <div class="dm-card dm-book anim" id="dm-book"><svg id="dm-art" viewBox="0 0 300 300" role="img" aria-label="Tu plato"></svg><div id="dm-cap"></div></div>
  <div class="dm-card">
   <p id="dm-ex"></p>
   <div id="dm-opts"></div>
   <div class="dm-sug">Sugerencias: <span id="dm-sug"></span></div>
   <div class="dm-tot"><b id="dm-total"></b><button type="button" id="dm-add">Agregar al pedido</button></div>
   <small id="dm-cart"></small>
  </div>
 </div>
</section>
<script>
(function(){
 /* Dibujo de la pizza */
 var T={"Queso extra":1,"Pepperoni":1,"Champiñones":1,"Aceitunas":1,"Jamón":1};
 var slots=[];[[36,5,0],[70,10,.31],[102,15,.1]].forEach(function(r){for(var j=0;j<r[1];j++){var a=r[2]+j*6.2832/r[1];slots.push({x:150+Math.cos(a)*r[0],y:150+Math.sin(a)*r[0],a:a})}});
 function piece(n,x,y,a){var d=(a*180/Math.PI+90).toFixed(0),rot=' transform="rotate('+d+' '+x+' '+y+')"';
  if(n==="Pepperoni")return '<circle cx="'+x+'" cy="'+y+'" r="12" fill="#a8221b"/><circle cx="'+x+'" cy="'+y+'" r="9.5" fill="#c43a2f"/><circle cx="'+(x-3)+'" cy="'+(y-3)+'" r="1.6" fill="#7e1510"/><circle cx="'+(x+3)+'" cy="'+(y+2)+'" r="1.6" fill="#7e1510"/>';
  if(n==="Champiñones")return '<g'+rot+'><path d="M'+(x-11)+' '+(y+2)+' Q'+(x-11)+' '+(y-10)+' '+x+' '+(y-10)+' Q'+(x+11)+' '+(y-10)+' '+(x+11)+' '+(y+2)+' Z" fill="#eadfc8"/><rect x="'+(x-3)+'" y="'+(y+2)+'" width="6" height="8" rx="2" fill="#d6c8aa"/></g>';
  if(n==="Aceitunas")return '<circle cx="'+x+'" cy="'+y+'" r="7" fill="#1f1f1f"/><circle cx="'+x+'" cy="'+y+'" r="3" fill="#f4cf68"/>';
  if(n==="Jamón")return '<rect x="'+(x-10)+'" y="'+(y-7)+'" width="20" height="14" rx="4" fill="#f2a6a6"'+rot+'/><rect x="'+(x-6)+'" y="'+(y-3)+'" width="12" height="3" rx="1.5" fill="#f9c9c9"'+rot+'/>';
  return '<ellipse cx="'+x+'" cy="'+y+'" rx="11" ry="8" fill="#fff4c4" opacity=".92"'+rot+'/>';}
 function pizzaSvg(sauce,list,pid,cuts){cuts=cuts||8;
  var s='<defs><radialGradient id="'+pid+'c" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#f1c86a"/><stop offset="1" stop-color="#c98a3e"/></radialGradient></defs>';
  s+='<circle cx="150" cy="156" r="146" fill="#000" opacity=".2"/><circle cx="150" cy="150" r="146" fill="url(#'+pid+'c)" stroke="#a96d2c" stroke-width="3"/>';
  for(var k=0;k<30;k++){var q=k*6.2832/30;s+='<circle cx="'+(150+Math.cos(q)*138)+'" cy="'+(150+Math.sin(q)*138)+'" r="6" fill="#f0c273" opacity=".6"/>'}
  s+='<circle cx="150" cy="150" r="127" fill="'+sauce+'"/><circle cx="150" cy="150" r="120" fill="#f4cf68"/>';
  for(var k=0;k<24;k++){var q=k*2.4,rr=14+(k*37)%100;s+='<circle cx="'+(150+Math.cos(q)*rr)+'" cy="'+(150+Math.sin(q)*rr)+'" r="'+(9+(k*7)%9)+'" fill="'+(k%2?"#fbe49a":"#e3b44e")+'" opacity=".5"/>'}
  for(var k=0;k<cuts;k++){var q=k*Math.PI*2/cuts+.39;s+='<line x1="150" y1="150" x2="'+(150+Math.cos(q)*140)+'" y2="'+(150+Math.sin(q)*140)+'" stroke="#a9742a" stroke-width="1.5" opacity=".35"/>'}
  var m=list.length,step=m===1?2:m;
  list.forEach(function(n,idx){slots.forEach(function(p,i){if(i%step===idx%step)s+='<g class="ly" style="--i:'+((i%10)*.5)+'">'+piece(n,p.x,p.y,p.a)+'</g>'})});
  return s}

 function cakeSvg(tiers,spv,flv,frv,decos){
  var s='<ellipse cx="150" cy="272" rx="135" ry="14" fill="#cfd8cb"/>';
  for(var i=0;i<tiers;i++){var w=200-i*55,h=56,y=262-(i+1)*h,x=150-w/2;
   s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="'+spv+'"/>';
   s+='<rect x="'+x+'" y="'+(y+h/2-4)+'" width="'+w+'" height="8" fill="'+flv+'"/>';
   s+='<rect x="'+(x-3)+'" y="'+(y-5)+'" width="'+(w+6)+'" height="16" rx="8" fill="'+frv+'"/>';for(var d=0;d<5;d++)s+='<rect x="'+(x+8+d*(w-30)/4)+'" y="'+(y+6)+'" width="10" height="'+(12+(d*7)%9)+'" rx="5" fill="'+frv+'"/>';s+='<rect x="'+x+'" y="'+y+'" width="14" height="'+h+'" rx="6" fill="#fff" opacity=".14"/>';}
  var topW=200-(tiers-1)*55,topY=262-tiers*56-5;
  if(decos.indexOf("Chispas")>-1){var cols=["#e63946","#2a9d8f","#f4d35e","#3a86ff","#ff70a6"];for(var j=0;j<14;j++)s+='<rect x="'+(150-topW/2+8+j*(topW-16)/13)+'" y="'+(topY+3+(j%2)*5)+'" width="6" height="3" rx="1.5" fill="'+cols[j%5]+'"/>';}
  if(decos.indexOf("Fresas")>-1)[-.4,0,.4].forEach(function(o){var cx=150+o*topW;s+='<path d="M'+(cx-9)+' '+(topY-12)+' Q'+cx+' '+(topY+8)+' '+(cx+9)+' '+(topY-12)+' Z" fill="#d62839"/><rect x="'+(cx-4)+'" y="'+(topY-15)+'" width="8" height="4" fill="#2f6b3a"/>'});
  if(decos.indexOf("Cerezas")>-1)[-.18,.18].forEach(function(o){var cx=150+o*topW;s+='<path d="M'+cx+' '+(topY-8)+' q4 -14 12 -16" stroke="#2f6b3a" stroke-width="2" fill="none"/><circle cx="'+cx+'" cy="'+(topY-4)+'" r="8" fill="#8b0a1a"/>'});
  if(decos.indexOf("Velas")>-1)[-.3,0,.3].forEach(function(o){var cx=150+o*topW;s+='<rect x="'+(cx-3)+'" y="'+(topY-26)+'" width="6" height="24" fill="#5bc0eb"/><ellipse cx="'+cx+'" cy="'+(topY-32)+'" rx="4" ry="6" fill="#ffb703"/>'});
  return s}

 var LY={
  pan:[26,function(b){return '<path d="M42 '+(b-26)+'H258Q262 '+b+' 220 '+b+'H80Q38 '+b+' 42 '+(b-26)+'Z" fill="#d99a4b"/><rect x="52" y="'+(b-21)+'" width="196" height="5" rx="2.5" fill="#f1c27a" opacity=".6"/>'}],
  tapa:[62,function(b){return '<path d="M38 '+b+'Q38 '+(b-66)+' 150 '+(b-66)+'Q262 '+(b-66)+' 262 '+b+'Z" fill="#dc9a45"/><ellipse cx="110" cy="'+(b-44)+'" rx="46" ry="12" fill="#f4c887" opacity=".55"/>'+[[100,48],[140,56],[180,50],[212,34],[78,30],[125,28],[165,32]].map(function(e){return '<ellipse cx="'+e[0]+'" cy="'+(b-e[1])+'" rx="4" ry="2" fill="#fff3d0"/>'}).join("")}],
  carne:[24,function(b){return '<rect x="46" y="'+(b-24)+'" width="208" height="24" rx="12" fill="#5a3320"/>'+[70,100,130,160,190,220].map(function(x,k){return '<ellipse cx="'+x+'" cy="'+(b-8-(k%2)*8)+'" rx="7" ry="3" fill="#3a2013"/>'}).join("")+'<rect x="60" y="'+(b-21)+'" width="90" height="3" rx="1.5" fill="#8a5a3c" opacity=".7"/>'}],
  queso:[12,function(b){return '<path d="M44 '+(b-10)+'H256V'+b+'H228L216 '+(b+10)+'L204 '+b+'H44Z" fill="#f6c63c"/><rect x="60" y="'+(b-8)+'" width="80" height="2" fill="#fff0a8" opacity=".8"/>'}],
  tomate:[12,function(b){return '<rect x="52" y="'+(b-12)+'" width="196" height="12" rx="6" fill="#d93a2b"/><rect x="72" y="'+(b-9)+'" width="60" height="3" rx="1.5" fill="#f08a7a" opacity=".7"/>'}],
  lechuga:[18,function(b){return '<path d="M44 '+(b-6)+'Q60 '+(b-26)+' 76 '+(b-8)+'T108 '+(b-8)+'T140 '+(b-8)+'T172 '+(b-8)+'T204 '+(b-8)+'T236 '+(b-8)+'L256 '+(b-4)+'L250 '+b+'Q150 '+(b+4)+' 50 '+b+'Z" fill="#6bbf4a" stroke="#8fd46a" stroke-width="2"/>'}],
  cebolla:[6,function(b){return '<rect x="64" y="'+(b-6)+'" width="172" height="6" rx="3" fill="#ead7f2" stroke="#b99ac9"/>'}],
  jamon:[10,function(b){return '<path d="M46 '+(b-8)+'Q96 '+(b-18)+' 150 '+(b-8)+'T254 '+(b-8)+'V'+b+'H46Z" fill="#f2a0a0"/>'}],
  pollo:[26,function(b){return '<rect x="48" y="'+(b-26)+'" width="204" height="26" rx="13" fill="#d99a3a"/>'+[72,104,138,172,204,230].map(function(x,k){return '<circle cx="'+x+'" cy="'+(b-8-(k%2)*8)+'" r="5" fill="#b87a28"/>'}).join("")}],
  pan2:[22,function(b){return '<rect x="50" y="'+(b-22)+'" width="200" height="22" rx="9" fill="#ead09a" stroke="#c99a55" stroke-width="4"/>'}]
 };
 function steam(xs,y){return xs.map(function(x,k){return '<path class="steam" style="--d:'+(k*.7)+'s" d="M'+x+' '+y+'q-12 -18 0 -34t0 -34" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>'}).join("")}
 function stackSvg(L){var y=252,s='<ellipse cx="150" cy="264" rx="125" ry="14" fill="#000" opacity=".25"/><ellipse cx="150" cy="258" rx="120" ry="12" fill="#f3f1ec"/>';
  L.forEach(function(n,i){var d=LY[n],b=y;y-=d[0];s+='<g class="ly" style="--i:'+i+'">'+d[1](b)+'</g>'});return s+steam([110,150,190],y-4)}

 /* ===== DATOS: aquí se cambian categorías, opciones y precios ===== */
 var SM={"Carne":"carne","Queso":"queso","Jamón":"jamon","Pollo":"pollo","Tomate":"tomate","Lechuga":"lechuga","Cebolla":"cebolla"};
 var uid=0;
 var CATS=[
  {id:"pizzas",t:"🍕 Pizzas",base:8,
   g1:["1. Cortes:",[["3 cortes",0,3],["4 cortes",.5,4],["6 cortes",1,6],["8 cortes",1.5,8]]],
   g2:["2. Ingredientes (+$1.00 c/u):",["Queso extra","Pepperoni","Champiñones","Aceitunas","Jamón"]],
   g3:["3. Salsa:",[["Tomate",0,"#d9402b"],["Barbacoa",.5,"#7a3b1e"],["Pesto",.5,"#6fa84a"]]],
   ex:"Elige los cortes, los ingredientes y la salsa. El precio se calcula solo."},
  {id:"sandwiches",t:"🍔 Sándwiches",base:4,
   g1:["1. Cortes:",[["Entero",0],["2 cortes",.5],["4 cortes",1]]],
   g2:["2. Ingredientes (+$1.00 c/u):",["Carne","Queso","Jamón","Pollo","Tomate","Lechuga","Cebolla"]],
   g3:["3. Salsa:",[["Mayonesa",0],["BBQ",.5],["Picante",.5]]],
   ex:"Cada ingrediente se apila entre los panes."},
  {id:"pasteleria",t:"🍰 Pastelería",base:8,
   g1:["1. Porciones:",[["3 porciones",0,3],["4 porciones",2,4],["6 porciones",4,6]]],
   g2:["2. Decoraciones (+$1.00 c/u):",["Fresas","Cerezas","Chispas","Velas"]],
   g3:["3. Bizcocho:",[["Vainilla",0,"#f3d9a4","#fff8ee"],["Chocolate",0,"#6b3f26","#8a5a3c"],["Fresa",0,"#f4a7b9","#f7b6cf"]]],
   ex:"Elige las porciones, el bizcocho y las decoraciones."}];
 /* Sugerencias: [categoría, nombre, índice de g1, ingredientes, índice de g3] */
 var SUG=[
  ["pizzas","Pepperoni Delight",3,["Pepperoni","Queso extra"],0],["pizzas","Margarita",1,["Queso extra","Aceitunas"],0],["pizzas","Vegetariana",2,["Champiñones","Aceitunas"],0],
  ["sandwiches","Cheeseburger",0,["Carne","Queso","Tomate","Lechuga"],0],["sandwiches","Club",2,["Jamón","Queso","Tomate","Lechuga"],0],["sandwiches","Pollo crujiente",0,["Pollo","Lechuga","Tomate"],1],
  ["pasteleria","Chocolate y berries",1,["Fresas","Cerezas"],1],["pasteleria","Pastel de fresa",2,["Fresas","Chispas"],2],["pasteleria","Cumpleaños",1,["Velas","Chispas"],0]];
 /* ===== FIN DE DATOS ===== */

 var $=function(i){return document.getElementById(i)},ci=0,sn="",st={g1:0,g2:[],g3:0},cart={n:0,t:0};
 function draw(c,s){var g1=c.g1[1][s.g1],g3=c.g3[1][s.g3];
  if(c.id==="pizzas")return pizzaSvg(g3[2],s.g2,"dmp"+(uid++),g1[2])+steam([110,150,190],90);
  if(c.id==="sandwiches")return stackSvg(["pan2"].concat(s.g2.map(function(n){return SM[n]}),["pan2"]));
  var n=g1[2],h='<g class="rise">'+cakeSvg(2,g3[2],"#fff3d6",g3[3],s.g2)+'</g>';
  for(var i=1;i<n;i++){var x=50+i*200/n;h+='<line x1="'+x+'" y1="'+((x>77&&x<223)?152:208)+'" x2="'+x+'" y2="262" stroke="#fff" stroke-width="2.5" stroke-dasharray="6 5" opacity=".85"/>'}return h}
 function price(c,s){return c.base+c.g1[1][s.g1][1]+s.g2.length+c.g3[1][s.g3][1]}
 function btn(g,i,txt,on,n){return '<button type="button" class="dm-opt'+(on?' on':'')+'" data-g="'+g+'" data-i="'+i+'" data-n="'+(n||"")+'">'+txt+'</button>'}
 function opts(){var c=CATS[ci];
  var a=c.g1[1].map(function(o,i){return btn(1,i,o[0]+(o[1]?' (+$'+o[1].toFixed(2)+')':''),st.g1===i)}).join("");
  var b=c.g2[1].map(function(o){var on=st.g2.indexOf(o)>-1;return btn(2,0,(on?'✓ ':'+ ')+o,on,o)}).join("");
  var d=c.g3[1].map(function(o,i){return btn(3,i,o[0]+(o[1]?' (+$'+o[1].toFixed(2)+')':''),st.g3===i)}).join("");
  $("dm-opts").innerHTML='<div class="dm-og"><b>'+c.g1[0]+'</b>'+a+'</div><div class="dm-og"><b>'+c.g2[0]+'</b>'+b+'</div><div class="dm-og"><b>'+c.g3[0]+'</b>'+d+'</div>';
  $("dm-sug").innerHTML=SUG.map(function(s,i){return s[0]===c.id?'<button type="button" class="dm-opt'+(s[1]===sn?' on':'')+'" data-s="'+i+'">'+s[1]+'</button>':""}).join("")}
 function art(){var c=CATS[ci];$("dm-art").innerHTML=draw(c,st);$("dm-total").textContent="$"+price(c,st).toFixed(2);$("dm-cap").textContent=(sn||c.t)+" — $"+price(c,st).toFixed(2)}
 function full(flip){[].forEach.call($("dm-tabs").children,function(b,i){b.classList.toggle("on",i===ci)});$("dm-ex").textContent=CATS[ci].ex;opts();
  var bk=$("dm-book");if(flip){bk.classList.remove("flip");void bk.offsetWidth;bk.classList.add("flip")}art()}
 function setCat(i){ci=i;var c=CATS[i];sn="";st={g1:0,g2:[],g3:0};full(true)}
 function loadSug(i){var s=SUG[i];ci=0;CATS.forEach(function(c,k){if(c.id===s[0])ci=k});sn=s[1];st={g1:s[2],g2:s[3].slice(),g3:s[4]};full(true)}
 CATS.forEach(function(c){$("dm-tabs").insertAdjacentHTML("beforeend",'<button type="button" class="dm-tab">'+c.t+'</button>')});
 $("dm").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("dm-tab"))return setCat([].indexOf.call($("dm-tabs").children,t));
  if(t.dataset.s)return loadSug(+t.dataset.s);
  if(t.id==="dm-add"){cart.n++;cart.t+=price(CATS[ci],st);$("dm-cart").textContent="Pedido: "+cart.n+" · $"+cart.t.toFixed(2);t.textContent="¡Agregado! ✓";setTimeout(function(){t.textContent="Agregar al pedido"},900);return}
  if(!t.dataset.g)return;
  var c=CATS[ci],g=t.dataset.g;sn="";
  if(g==="1")st.g1=+t.dataset.i;else if(g==="3")st.g3=+t.dataset.i;
  else{var n=t.dataset.n,a=st.g2.indexOf(n)>-1?st.g2.filter(function(x){return x!==n}):st.g2.concat(n);st.g2=c.g2[1].filter(function(x){return a.indexOf(x)>-1})}
  opts();art()});
 loadSug(0);
})();
</script>
<!-- ===== FIN DEL MÓDULO (hasta aquí) ===== -->
</body>
</html>
