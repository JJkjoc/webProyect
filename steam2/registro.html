<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameStore - Acceso</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #0d0d0d;
      color: #e5e5e5;
      min-height: 100vh;
    }

    .bg-panel {
      background-color: #161616;
      border: 1px solid #242424;
    }

    .text-naranja { color: #ff6b00 !important; }

    .btn-naranja {
      background-color: #ff6b00;
      color: #fff;
      font-weight: 600;
      border: none;
    }
    .btn-naranja:hover {
      background-color: #cc5500;
      color: #fff;
    }

    /* Botón volver en esquina superior derecha */
    .btn-volver {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    /* Pestañas simples */
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #8c8c8c;
      padding: 10px 16px;
      font-weight: 600;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.activo {
      color: #fff;
      border-bottom-color: #ff6b00;
    }

    /* Campos oscuros */
    .input-steam {
      background-color: #242424;
      border: 1px solid #363636;
      color: #fff;
    }
    .input-steam:focus {
      background-color: #2a2a2a;
      border-color: #ff6b00;
      color: #fff;
      box-shadow: none;
    }

    .vista-form { display: none; }
    .vista-form.activa { display: block; }
  </style>
</head>
<body class="d-flex flex-column justify-content-center py-5">

  <!-- BOTÓN VOLVER ATRÁS (Esquina superior derecha) -->
  <a href="index.html" class="btn btn-outline-secondary btn-sm text-white btn-volver">
    <i class="bi bi-arrow-left"></i> Volver atrás
  </a>

  <main class="container">
    <div class="mx-auto" style="max-width: 440px;">

      <!-- TÍTULO CENTRADO -->
      <div class="text-center mb-4">
        <h1 class="fw-bold text-white m-0">
          <i class="bi bi-controller text-naranja"></i> Game<span class="text-naranja">Store</span>
        </h1>
      </div>

      <!-- PESTAÑAS INICIAR SESIÓN / REGISTRARSE -->
      <div class="d-flex border-bottom border-dark mb-3">
        <button class="tab-btn activo w-50" id="btn-tab-login" onclick="mostrarFormulario('login')">INICIAR SESIÓN</button>
        <button class="tab-btn w-50" id="btn-tab-registro" onclick="mostrarFormulario('registro')">REGISTRARSE</button>
      </div>

      <!-- FORMULARIO INICIAR SESIÓN -->
      <div id="vista-login" class="vista-form activa bg-panel p-4">
        <h4 class="text-white fw-bold mb-3">Iniciar sesión</h4>
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="login-usuario" class="form-label small text-naranja fw-bold">NOMBRE DE USUARIO</label>
            <input type="text" id="login-usuario" class="form-control input-steam" placeholder="Tu usuario">
          </div>

          <div class="mb-3">
            <label for="login-pass" class="form-label small text-secondary fw-bold">CONTRASEÑA</label>
            <input type="password" id="login-pass" class="form-control input-steam" placeholder="••••••••">
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="recordarme">
            <label class="form-check-label small text-secondary" for="recordarme">Recordarme</label>
          </div>

          <button type="submit" class="btn btn-naranja w-100 py-2">Iniciar sesión</button>

          <p class="small text-secondary text-center mt-3 mb-0">
            ¿No tienes cuenta? <a href="#" class="text-naranja text-decoration-none" onclick="mostrarFormulario('registro'); return false;">Regístrate aquí</a>
          </p>
        </form>
      </div>

      <!-- FORMULARIO REGISTRARSE -->
      <div id="vista-registro" class="vista-form bg-panel p-4">
        <h4 class="text-white fw-bold mb-3">Crear cuenta</h4>
        <form id="form-registro" novalidate>
          <div class="mb-3">
            <label for="reg-usuario" class="form-label small text-naranja fw-bold">NOMBRE DE USUARIO</label>
            <input type="text" id="reg-usuario" class="form-control input-steam" placeholder="Elige un usuario">
          </div>

          <div class="mb-3">
            <label for="reg-correo" class="form-label small text-secondary fw-bold">CORREO ELECTRÓNICO</label>
            <input type="email" id="reg-correo" class="form-control input-steam" placeholder="correo@ejemplo.com">
          </div>

          <div class="mb-3">
            <label for="reg-pass" class="form-label small text-secondary fw-bold">CONTRASEÑA</label>
            <input type="password" id="reg-pass" class="form-control input-steam" placeholder="Mínimo 6 caracteres">
          </div>

          <div class="mb-3">
            <label for="reg-pass2" class="form-label small text-secondary fw-bold">CONFIRMAR CONTRASEÑA</label>
            <input type="password" id="reg-pass2" class="form-control input-steam" placeholder="Repite tu contraseña">
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="terminos">
            <label class="form-check-label small text-secondary" for="terminos">
              Tengo 13 años o más y acepto los términos de GameStore.
            </label>
          </div>

          <button type="submit" class="btn btn-naranja w-100 py-2">Crear cuenta</button>

          <p class="small text-secondary text-center mt-3 mb-0">
            ¿Ya tienes cuenta? <a href="#" class="text-naranja text-decoration-none" onclick="mostrarFormulario('login'); return false;">Inicia sesión</a>
          </p>
        </form>
      </div>

    </div>
  </main>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- JavaScript funcional sencillo -->
  <script>
    // Cambiar entre vista de Login y Registro
    function mostrarFormulario(tipo) {
      document.getElementById('vista-login').classList.toggle('activa', tipo === 'login');
      document.getElementById('vista-registro').classList.toggle('activa', tipo === 'registro');

      document.getElementById('btn-tab-login').classList.toggle('activo', tipo === 'login');
      document.getElementById('btn-tab-registro').classList.toggle('activo', tipo === 'registro');
    }

    function mostrarExito() {
      Swal.fire({
        icon: 'success',
        title: 'accion completa con exito',
        background: '#161616',
        color: '#e5e5e5',
        confirmButtonColor: '#ff6b00'
      });
    }

    // 1. REGISTRARSE
    document.getElementById('form-registro').addEventListener('submit', function(e) {
      e.preventDefault();
      const usuario = document.getElementById('reg-usuario').value.trim();
      const correo = document.getElementById('reg-correo').value.trim();

      if (usuario !== '') {
        localStorage.setItem('gamestore_sesion', usuario);
      } else if (correo !== '') {
        localStorage.setItem('gamestore_sesion', correo);
      }

      mostrarExito();
    });

    // 2. INICIAR SESIÓN
    document.getElementById('form-login').addEventListener('submit', function(e) {
      e.preventDefault();
      const usuario = document.getElementById('login-usuario').value.trim();

      if (usuario !== '') {
        localStorage.setItem('gamestore_sesion', usuario);
      }

      mostrarExito();
    });
  </script>
</body>
</html>
